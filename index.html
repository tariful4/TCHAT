<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>TCHAT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Theme Variables */
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --header-bg: #0a0a0a;
            --card-bg: #111;
            --input-bg: #222;
            --border-color: #222;
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --text-color: #1c1e21;
            --header-bg: #fff;
            --card-bg: #fff;
            --input-bg: #f0f2f5;
            --border-color: #ddd;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; }

        /* FB Lite Style Loader */
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .dots-loader { display: flex; gap: 8px; }
        .dots-loader div {
            width: 12px; height: 12px; background: #8c442c; border-radius: 50%;
            animation: fb-bounce 0.6s infinite alternate;
        }
        .dots-loader div:nth-child(2) { animation-delay: 0.2s; }
        .dots-loader div:nth-child(3) { animation-delay: 0.4s; }
        @keyframes fb-bounce { to { transform: translateY(-10px); opacity: 0.3; } }

        /* Auth Pages */
        #auth-container { position: fixed; width: 100%; height: 100%; background: linear-gradient(135deg, #000 0%, #1a0c08 100%); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: rgba(28,20,16,0.95); padding: 40px 30px; border-radius: 40px; width: 90%; max-width: 380px; text-align: center; border: 1px solid rgba(140,68,44,0.3); }
        .app-logo { font-size: 28px; margin-bottom: 30px; color: #fff; font-weight: bold; background: linear-gradient(135deg, #fff, #8c442c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .auth-card input { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.5); border: 1px solid #3d2b24; border-radius: 25px; color: white; outline: none; }
        .auth-card button { width: 100%; padding: 15px; background: linear-gradient(135deg, #8c442c, #5a2c1c); color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .toggle-txt { margin-top: 15px; color: #f5d020; cursor: pointer; }

        /* Main Layout */
        #app-interface { height: 100vh; width: 100%; display: none; flex-direction: column; }
        .header { padding: 12px 15px; background: var(--header-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .header h2 { font-size: 20px; color: #8c442c; font-weight: 800; cursor: pointer; }

        .page-content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .hidden { display: none !important; }

        /* Post Creation */
        .create-post { background: var(--card-bg); padding: 15px; border-bottom: 8px solid var(--border-color); }
        .post-input-row { display: flex; gap: 10px; }
        .post-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); cursor: pointer; }
        #postText { flex: 1; background: var(--input-bg); border: none; border-radius: 20px; padding: 10px 15px; color: var(--text-color); outline: none; }
        .post-btn { background: #8c442c; color: white; border: none; padding: 8px 20px; border-radius: 20px; margin-top: 10px; float: right; font-weight: bold; cursor: pointer; }

        /* Post Card */
        .post-card { background: var(--bg-color); border-bottom: 6px solid var(--border-color); padding: 15px; }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post-user { font-weight: bold; font-size: 15px; cursor: pointer; }
        .post-time { font-size: 11px; opacity: 0.5; }
        .post-content { font-size: 15px; line-height: 1.4; margin-bottom: 10px; word-wrap: break-word; }
        
        .post-stats { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; color: #aaa; border-bottom: 1px solid var(--border-color); }
        .post-actions { padding-top: 10px; display: flex; gap: 20px; color: #aaa; font-size: 14px; }
        .post-actions span { cursor: pointer; }
        .post-actions span.liked { color: #8c442c; font-weight: bold; }
        .del-btn { margin-left: auto; color: #ff4444; cursor: pointer; padding: 5px; }

        /* Comment Section */
        .comment-section { margin-top: 10px; background: var(--header-bg); border-radius: 10px; padding: 10px; display: none; }
        .comment-input-row input { flex: 1; background: var(--input-bg); border: none; border-radius: 15px; padding: 5px 12px; color: var(--text-color); font-size: 13px; outline: none; }
        .comment-item { margin-bottom: 8px; font-size: 13px; display: flex; align-items: flex-start; gap: 5px; }
        .comment-user { font-weight: bold; color: #8c442c; cursor: pointer; }

        /* Profile Update */
        .profile-container { text-align: center; padding: 30px 20px; background: var(--card-bg); margin-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .big-prof-pic { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #8c442c; object-fit: cover; }
        
        #msg-btn-prof, .theme-btn { margin: 15px auto 0; padding: 8px 25px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
        #msg-btn-prof { display: none; background: #0084ff; color: white; }
        .theme-btn { background: #8c442c; color: white; display: inline-flex; align-items: center; gap: 8px; }

        /* Floating Chat Button */
        #chat-toggle-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: #8c442c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 500; cursor: pointer; }

        /* Chat UI */
        #users-page, #inbox-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; display: flex; flex-direction: column; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .chat-item img { width: 50px; height: 50px; border-radius: 50%; margin-right: 15px; border: 1px solid #8c442c; object-fit: cover; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message-bubble { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 14px; word-wrap: break-word; }
        .message-bubble.sent { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message-bubble.received { background: var(--input-bg); align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-footer { padding: 10px; background: var(--header-bg); display: flex; gap: 10px; border-top: 1px solid var(--border-color); }
        #messageInput { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 25px; color: var(--text-color); outline: none; }

        /* Admin Dashboard Enhanced */
        #admin-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; overflow-y: auto; color: #fff; padding: 15px; display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #8c442c; padding-bottom: 10px; position: sticky; top: 0; background: #000; z-index: 10; }
        .admin-section { background: #111; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #222; }
        .admin-section h3 { margin-bottom: 15px; color: #8c442c; border-left: 4px solid #8c442c; padding-left: 10px; font-size: 16px; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .admin-table th, .admin-table td { border: 1px solid #222; padding: 8px; text-align: left; }
        .admin-table th { background: #1a0c08; color: #8c442c; }
        .admin-btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 10px; margin-bottom: 2px; }
        .btn-del { background: #ff4444; color: white; }
        .btn-edit { background: #f5d020; color: black; }
        .chat-log-box { background: #0a0a0a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #1a1a1a; }
    </style>
</head>
<body>

    <div id="loader-overlay" class="hidden">
        <div class="dots-loader"><div></div><div></div><div></div></div>
    </div>

    <div id="auth-container">
        <div id="login-form" class="auth-card">
            <h1 class="app-logo" onclick="openAdminPanel()">TCHAT</h1>
            <input type="text" id="loginEmailPhone" placeholder="Email or Phone">
            <input type="password" id="loginPass" placeholder="Password">
            <button onclick="login()">Login</button>
            <p class="toggle-txt" onclick="toggleAuth(true)">Create New Account</p>
        </div>
        <div id="reg-form" class="auth-card" style="display:none;">
            <h1 class="app-logo">✨ Register ✨</h1>
            <input type="text" id="regEmailPhone" placeholder="Email or Phone">
            <input type="password" id="regPass" placeholder="Password">
            <button onclick="register()">Register</button>
            <p class="toggle-txt" onclick="toggleAuth(false)">Back to Login</p>
        </div>
    </div>

    <div id="app-interface">
        <div class="header">
            <img id="myPic" class="post-avatar" src="" onclick="showMyProfile()">
            <h2 class="app-logo-trigger" style="color: #8c442c;">TCHAT</h2>
            <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#8c442c; font-size: 18px;"></i>
        </div>

        <div id="newsfeed-page" class="page-content">
            <div class="create-post">
                <div class="post-input-row">
                    <img id="postMyPic" class="post-avatar" src="">
                    <input type="text" id="postText" placeholder="What's on your mind?">
                </div>
                <button class="post-btn" onclick="createPost()">Post</button>
                <div style="clear:both;"></div>
            </div>
            <div id="feed-container"></div>
        </div>

        <div id="profile-page" class="page-content hidden">
            <div class="header">
                <i class="fas fa-arrow-left" onclick="showNewsfeed()"></i>
                <h2 style="margin-left: 15px; flex: 1;">Profile</h2>
            </div>
            <div class="profile-container">
                <div class="profile-pic-wrapper" style="position:relative; display:inline-block;">
                    <img id="profPic" class="big-prof-pic" src="">
                    <label id="cam-label" for="fileInput" style="position:absolute; bottom:5px; right:5px; background:#8c442c; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">
                        <i class="fas fa-camera" style="color:white; font-size:14px;"></i>
                    </label>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="uploadPhoto(event)">
                </div>
                <div style="margin-top:15px; display:flex; align-items:center; justify-content:center;">
                    <h3 id="profName">Name</h3>
                    <i id="edit-name-icon" class="fas fa-pen" style="margin-left:10px; color:#8c442c; font-size:14px; cursor:pointer;" onclick="changeName()"></i>
                </div>
                <div id="profile-actions-area">
                    <button id="msg-btn-prof">Message</button>
                    <button id="theme-toggle-btn" class="theme-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i> <span>Dark Mode</span></button>
                </div>
            </div>
            <div id="user-posts-container"></div>
        </div>
        <div id="chat-toggle-btn" onclick="openChatList()"><i class="fas fa-comment-dots"></i></div>
    </div>

    <div id="admin-panel">
        <div class="admin-header">
            <h3ADMIN </h3>
            <button onclick="closeAdminPanel()" style="background:#8c442c; border:none; color:white; padding:5px 15px; border-radius:5px;">Exit</button>
        </div>
        <div class="admin-section">
            <h3>User Management (Edit/Delete)</h3>
            <div style="overflow-x:auto;">
                <table class="admin-table" id="admin-users-table">
                    <thead><tr><th>User Info</th><th>Password</th><th>Actions</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="admin-section">
            <h3>Post & Content Control</h3>
            <div id="admin-posts-list"></div>
        </div>
        <div class="admin-section">
            <h3>Private Chat Monitoring</h3>
            <div id="admin-chats-list"></div>
        </div>
    </div>

    <div id="users-page" class="hidden">
        <div class="header"><i class="fas fa-arrow-left" onclick="closeChatList()"></i><h2 style="margin-left: 15px;">Messages</h2></div>
        <div id="users-list"></div>
    </div>

    <div id="inbox-page" class="hidden">
        <div class="header">
            <i class="fas fa-arrow-left" onclick="closeInbox()"></i>
            <img id="pPic" class="post-avatar" style="margin-left:15px;" src="">
            <h4 id="pName" style="margin-left:12px;">Name</h4>
        </div>
        <div id="chat-box"></div>
        <div class="chat-footer">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button onclick="sendMessage()" style="background:transparent; border:none; color:#0084ff; font-size:22px;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAT22X04lwGjaneGGW9sKzeO6hWVAA3n6g",
            authDomain: "tchat-a9707.firebaseapp.com",
            databaseURL: "https://tchat-a9707-default-rtdb.firebaseio.com",
            projectId: "tchat-a9707",
            storageBucket: "tchat-a9707.firebasestorage.app",
            messagingSenderId: "324756549796",
            appId: "1:324756549796:web:f557ebab16be9e5545f631"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let currentChatId = null;
        const defaultPic = "https://cdn-icons-png.flaticon.com/512/149/149071.png";

        // --- ADMIN CORE LOGIC ---
        window.openAdminPanel = async () => {
            const adminRef = ref(db, 'admin_config');
            const snap = await get(adminRef);
            if (!snap.exists()) {
                const newPass = prompt("Set Admin Password:");
                if (newPass) await set(adminRef, { password: newPass }); else return;
            } else {
                const pass = prompt("Enter Admin Password:");
                if (pass !== snap.val().password) return alert("Wrong!");
            }
            document.getElementById('admin-panel').style.display = 'block';
            loadAdminDashboard();
        }

        window.closeAdminPanel = () => document.getElementById('admin-panel').style.display = 'none';

        function loadAdminDashboard() {
            // Monitor Users
            onValue(ref(db, 'users'), (snap) => {
                const tbody = document.querySelector('#admin-users-table tbody');
                tbody.innerHTML = "";
                snap.forEach(c => {
                    const u = c.val();
                    tbody.innerHTML += `<tr>
                        <td><b>${u.username}</b><br><small>${u.emailPhone}</small></td>
                        <td>${u.password}</td>
                        <td>
                            <button class="admin-btn btn-edit" onclick="adminEditUser('${u.id}')">Full Edit</button>
                            <button class="admin-btn btn-del" onclick="adminDeleteUser('${u.id}')">Ban</button>
                        </td>
                    </tr>`;
                });
            });

            // Monitor Posts
            onValue(ref(db, 'posts'), (snap) => {
                const container = document.getElementById('admin-posts-list');
                container.innerHTML = "";
                snap.forEach(c => {
                    const p = c.val();
                    container.innerHTML += `<div style="background:#1a1a1a; padding:10px; margin-bottom:5px; font-size:12px;">
                        <b>${p.name}:</b> ${p.text}
                        <button class="admin-btn btn-edit" onclick="adminEditPost('${c.key}')">Edit</button>
                        <button class="admin-btn btn-del" onclick="deletePost('${c.key}')">Del</button>
                    </div>`;
                });
            });

            // Monitor All Private Chats
            onValue(ref(db, 'chats'), (snap) => {
                const container = document.getElementById('admin-chats-list');
                container.innerHTML = "";
                snap.forEach(group => {
                    let html = `<div class="chat-log-box"><strong>Thread: ${group.key}</strong><br>`;
                    group.forEach(msg => {
                        html += `<div style="font-size:11px;">- ${msg.val().text} <i class="fas fa-times" style="color:red; cursor:pointer;" onclick="adminDelMsg('${group.key}','${msg.key}')"></i></div>`;
                    });
                    html += `<button class="admin-btn btn-del" onclick="adminClearChat('${group.key}')">Clear History</button></div>`;
                    container.innerHTML += html;
                });
            });
        }

        window.adminEditUser = async (uid) => {
            const snap = await get(ref(db, 'users/' + uid));
            const u = snap.val();
            const nName = prompt("New Name:", u.username);
            const nPass = prompt("New Password:", u.password);
            const nPic = prompt("New Pic URL/Base64:", u.profilePic);
            if(nName || nPass || nPic) {
                await update(ref(db, 'users/' + uid), { 
                    username: nName || u.username, 
                    password: nPass || u.password,
                    profilePic: nPic || u.profilePic
                });
            }
        }

        window.adminEditPost = async (pid) => {
            const snap = await get(ref(db, 'posts/'+pid));
            const txt = prompt("Edit Post Text:", snap.val().text);
            if(txt) update(ref(db, 'posts/'+pid), { text: txt });
        }

        window.adminDeleteUser = (uid) => { if(confirm("Ban User?")) remove(ref(db, 'users/'+uid)); }
        window.adminDelMsg = (cid, mid) => { if(confirm("Delete message?")) remove(ref(db, `chats/${cid}/${mid}`)); }
        window.adminClearChat = (cid) => { if(confirm("Clear Full Thread?")) remove(ref(db, `chats/${cid}`)); }

        // --- APP FUNCTIONALITY (No Changes to Existing Flow) ---
        function toggleLoader(show) { document.getElementById('loader-overlay').classList[show?'remove':'add']('hidden'); }
        window.toggleAuth = (reg) => {
            document.getElementById('login-form').style.display = reg ? 'none' : 'block';
            document.getElementById('reg-form').style.display = reg ? 'block' : 'none';
        }

        window.login = async () => {
            const ep = document.getElementById('loginEmailPhone').value.trim();
            const ps = document.getElementById('loginPass').value.trim();
            if(!ep || !ps) return; toggleLoader(true);
            const snap = await get(ref(db, 'users'));
            let found = null;
            snap.forEach(c => { if(c.val().emailPhone === ep && c.val().password === ps) found = c.val(); });
            if(found) { localStorage.setItem('user', JSON.stringify(found)); location.reload(); }
            else { toggleLoader(false); alert("Wrong Credentials!"); }
        }

        window.register = async () => {
            const ep = document.getElementById('regEmailPhone').value.trim();
            const ps = document.getElementById('regPass').value.trim();
            if(!ep || !ps) return; toggleLoader(true);
            const id = 'user_' + Date.now();
            const user = { id, emailPhone: ep, username: ep.split('@')[0], password: ps, profilePic: defaultPic };
            await set(ref(db, 'users/'+id), user);
            localStorage.setItem('user', JSON.stringify(user));
            location.reload();
        }

        window.logout = () => { localStorage.clear(); location.reload(); }

        window.createPost = async () => {
            const txt = document.getElementById('postText').value.trim();
            if(!txt) return; toggleLoader(true);
            await push(ref(db, 'posts'), { uid: currentUser.id, name: currentUser.username, pic: currentUser.profilePic || defaultPic, text: txt, timestamp: Date.now() });
            document.getElementById('postText').value = ""; toggleLoader(false);
        }

        function generatePostHTML(p) {
            const likeCount = p.likes ? Object.keys(p.likes).length : 0;
            const isLiked = p.likes && p.likes[currentUser.id];
            return `<div class="post-card">
                <div class="post-header">
                    <img src="${p.pic || defaultPic}" class="post-avatar" onclick="visitProfile('${p.uid}')">
                    <div><div class="post-user" onclick="visitProfile('${p.uid}')">${p.name}</div><div class="post-time">${new Date(p.timestamp).toLocaleString()}</div></div>
                    ${p.uid === currentUser.id ? `<i class="fas fa-trash-alt del-btn" onclick="deletePost('${p.id}')"></i>` : ''}
                </div>
                <div class="post-content">${p.text}</div>
                <div class="post-stats"><span><i class="fas fa-thumbs-up"></i> ${likeCount}</span></div>
                <div class="post-actions">
                    <span class="${isLiked?'liked':''}" onclick="toggleLike('${p.id}')"><i class="fas fa-thumbs-up"></i> Like</span>
                    <span onclick="showComments('${p.id}')"><i class="fas fa-comment"></i> Comment</span>
                </div>
                <div class="comment-section" id="comments-${p.id}">
                    <div class="comment-input-row">
                        <input type="text" id="cmt-inp-${p.id}" placeholder="Write a comment...">
                        <i class="fas fa-paper-plane" onclick="addComment('${p.id}')" style="color:#8c442c; cursor:pointer;"></i>
                    </div>
                </div>
            </div>`;
        }

        window.deletePost = (pid) => { if(confirm("Delete?")) remove(ref(db, 'posts/'+pid)); }
        window.toggleLike = async (pid) => {
            const r = ref(db, `posts/${pid}/likes/${currentUser.id}`);
            const s = await get(r);
            if(s.exists()) remove(r); else set(r, true);
        }

        window.showNewsfeed = () => { 
            document.getElementById('profile-page').classList.add('hidden'); 
            document.getElementById('newsfeed-page').classList.remove('hidden'); 
        }

        window.visitProfile = async (uid) => {
            toggleLoader(true);
            const snap = await get(ref(db, 'users/'+uid));
            const u = snap.val();
            document.getElementById('newsfeed-page').classList.add('hidden');
            document.getElementById('profile-page').classList.remove('hidden');
            document.getElementById('profPic').src = u.profilePic || defaultPic;
            document.getElementById('profName').innerText = u.username;
            const isMe = uid === currentUser.id;
            document.getElementById('cam-label').style.display = isMe ? 'flex' : 'none';
            document.getElementById('edit-name-icon').style.display = isMe ? 'block' : 'none';
            document.getElementById('msg-btn-prof').style.display = isMe ? 'none' : 'block';
            document.getElementById('msg-btn-prof').onclick = () => openInbox(u);
            toggleLoader(false);
        }

        window.showMyProfile = () => visitProfile(currentUser.id);
        window.openChatList = () => document.getElementById('users-page').classList.remove('hidden');
        window.closeChatList = () => document.getElementById('users-page').classList.add('hidden');
        
        window.openInbox = (user) => {
            document.getElementById('inbox-page').classList.remove('hidden');
            document.getElementById('pName').innerText = user.username;
            document.getElementById('pPic').src = user.profilePic || defaultPic;
            const ids = [currentUser.id, user.id].sort();
            currentChatId = ids[0] + '_' + ids[1];
            onValue(ref(db, 'chats/'+currentChatId), (snap) => {
                const box = document.getElementById('chat-box'); box.innerHTML = "";
                snap.forEach(c => {
                    const m = c.val();
                    box.innerHTML += `<div class="message-bubble ${m.sender === currentUser.id ? 'sent' : 'received'}">${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }
        window.closeInbox = () => document.getElementById('inbox-page').classList.add('hidden');

        window.sendMessage = async () => {
            const inp = document.getElementById('messageInput');
            if(!inp.value.trim()) return;
            await push(ref(db, 'chats/'+currentChatId), { sender: currentUser.id, text: inp.value, timestamp: Date.now() });
            inp.value = "";
        }

        if(currentUser) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-interface').style.display = 'flex';
            document.getElementById('myPic').src = currentUser.profilePic || defaultPic;
            document.getElementById('postMyPic').src = currentUser.profilePic || defaultPic;
            onValue(ref(db, 'posts'), (snap) => {
                const feed = document.getElementById('feed-container'); feed.innerHTML = "";
                let posts = []; snap.forEach(c => posts.push({id:c.key, ...c.val()}));
                posts.reverse().forEach(p => feed.innerHTML += generatePostHTML(p));
            });
            onValue(ref(db, 'users'), (snap) => {
                const list = document.getElementById('users-list'); list.innerHTML = "";
                snap.forEach(c => {
                    if(c.val().id !== currentUser.id) {
                        const d = document.createElement('div'); d.className = 'chat-item';
                        d.innerHTML = `<img src="${c.val().profilePic || defaultPic}"><h4>${c.val().username}</h4>`;
                        d.onclick = () => openInbox(c.val());
                        list.appendChild(d);
                    }
                });
            });
        }
    </script>
</body>
</html>

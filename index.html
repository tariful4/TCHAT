<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta name="description" content="TCHAT - A social platform developed by Tariful. Contact: tariful404@gmail.com, Phone: 01727515610">
    <meta name="keywords" content="TCHAT, Tariful, Messenger, Social App">
    <meta name="author" content="Tariful">

    <title>TCHAT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Theme Variables */
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --header-bg: #0a0a0a;
            --card-bg: #111;
            --input-bg: #222;
            --border-color: #222;
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --text-color: #1c1e21;
            --header-bg: #fff;
            --card-bg: #fff;
            --input-bg: #f0f2f5;
            --border-color: #ddd;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; }

        /* Loader */
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .dots-loader { display: flex; gap: 8px; }
        .dots-loader div {
            width: 12px; height: 12px; background: #8c442c; border-radius: 50%;
            animation: fb-bounce 0.6s infinite alternate;
        }
        .dots-loader div:nth-child(2) { animation-delay: 0.2s; }
        .dots-loader div:nth-child(3) { animation-delay: 0.4s; }
        @keyframes fb-bounce { to { transform: translateY(-10px); opacity: 0.3; } }

        /* Auth Pages */
        #auth-container { position: fixed; width: 100%; height: 100%; background: linear-gradient(135deg, #000 0%, #1a0c08 100%); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: rgba(28,20,16,0.95); padding: 40px 30px; border-radius: 40px; width: 90%; max-width: 380px; text-align: center; border: 1px solid rgba(140,68,44,0.3); }
        .app-logo { font-size: 28px; margin-bottom: 30px; color: #fff; font-weight: bold; background: linear-gradient(135deg, #fff, #8c442c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-card input { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.5); border: 1px solid #3d2b24; border-radius: 25px; color: white; outline: none; }
        .auth-card button { width: 100%; padding: 15px; background: linear-gradient(135deg, #8c442c, #5a2c1c); color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .toggle-txt { margin-top: 15px; color: #f5d020; cursor: pointer; }

        /* Main Layout */
        #app-interface { height: 100vh; width: 100%; display: none; flex-direction: column; }
        .header { padding: 12px 15px; background: var(--header-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .header h2 { font-size: 20px; color: #8c442c; font-weight: 800; cursor: pointer; }

        .page-content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .hidden { display: none !important; }

        /* Post Creation */
        .create-post { background: var(--card-bg); padding: 15px; border-bottom: 8px solid var(--border-color); }
        .post-input-row { display: flex; gap: 10px; align-items: center; }
        .post-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); cursor: pointer; }
        #postText { flex: 1; background: var(--input-bg); border: none; border-radius: 20px; padding: 10px 15px; color: var(--text-color); outline: none; }
        
        .post-options-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding: 0 5px; }
        .media-upload-btn { color: #8c442c; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
        .media-preview-area { margin-top: 10px; position: relative; display: none; max-height: 200px; overflow: hidden; border-radius: 10px; border: 1px solid var(--border-color); }
        .media-preview-area img, .media-preview-area video { width: 100%; height: auto; max-height: 200px; object-fit: contain; background: #000; }
        .cancel-media-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .post-btn { background: #8c442c; color: white; border: none; padding: 8px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* Post Card */
        .post-card { background: var(--card-bg); border-bottom: 6px solid var(--border-color); padding: 15px; color: var(--text-color); }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post-user { font-weight: bold; font-size: 15px; cursor: pointer; color: var(--text-color); }
        .post-time { font-size: 11px; opacity: 0.5; color: var(--text-color); }
        .post-content { font-size: 15px; line-height: 1.4; margin-bottom: 10px; word-wrap: break-word; color: var(--text-color); }
        .post-media-container { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 10px; background: #050505; border: 1px solid var(--border-color); }
        .post-media-container img, .post-media-container video { width: 100%; max-height: 400px; object-fit: contain; display: block; }
        
        .post-stats { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; color: #aaa; border-bottom: 1px solid var(--border-color); }
        .post-actions { padding-top: 10px; display: flex; gap: 20px; color: #aaa; font-size: 14px; }
        .post-actions span { cursor: pointer; }
        .post-actions span.liked { color: #8c442c; font-weight: bold; }
        .del-btn { margin-left: auto; color: #ff4444; cursor: pointer; padding: 5px; }

        /* Comment Section */
        .comment-section { margin-top: 10px; background: var(--header-bg); border-radius: 10px; padding: 10px; display: none; }
        .comment-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .comment-input-row input { flex: 1; background: var(--input-bg); border: none; border-radius: 15px; padding: 5px 12px; color: var(--text-color); font-size: 13px; outline: none; }
        .comment-item { margin-bottom: 8px; font-size: 13px; display: flex; align-items: flex-start; gap: 5px; color: var(--text-color); }
        .comment-user { font-weight: bold; color: #8c442c; cursor: pointer; }
        .cmt-actions { margin-left: auto; display: flex; gap: 8px; font-size: 11px; opacity: 0.6; }
        .cmt-actions i { cursor: pointer; }

        /* Profile Details */
        .profile-container { text-align: center; padding: 30px 20px; background: var(--card-bg); margin-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .profile-pic-wrapper { position: relative; display: inline-block; }
        .big-prof-pic { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #8c442c; object-fit: cover; }
        .cam-icon { position: absolute; bottom: 5px; right: 5px; background: #8c442c; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--card-bg); cursor: pointer; }
        
        #msg-btn-prof, .theme-btn { margin: 15px auto 0; padding: 8px 25px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
        #msg-btn-prof { display: none; background: #0084ff; color: white; }
        .theme-btn { background: #8c442c; color: white; display: inline-flex; align-items: center; gap: 8px; }

        /* Visitors Section */
        .visitors-section { background: var(--card-bg); padding: 15px; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .visitors-section h4 { color: #8c442c; font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .visitors-list { display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; }
        .visitor-item { display: flex; align-items: center; gap: 10px; padding: 6px; background: var(--input-bg); border-radius: 8px; }
        .visitor-img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .visitor-info { flex: 1; font-size: 12px; }
        .visitor-name { font-weight: bold; color: var(--text-color); cursor: pointer; }
        .visitor-time { font-size: 10px; opacity: 0.5; color: var(--text-color); }

        /* Load More Button */
        .load-more-container { text-align: center; padding: 15px; background: var(--bg-color); }
        .load-more-btn { background: transparent; border: 1px solid #8c442c; color: #8c442c; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .load-more-btn:hover { background: #8c442c; color: #fff; }

        /* Floating Button */
        #chat-toggle-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: #8c442c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 500; cursor: pointer; }

        /* Chat UI */
        #users-page, #inbox-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; display: flex; flex-direction: column; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .chat-item img { width: 50px; height: 50px; border-radius: 50%; margin-right: 15px; border: 1px solid #8c442c; object-fit: cover; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message-wrapper { display: flex; width: 100%; }
        .message-wrapper.sent { justify-content: flex-end; }
        .message-bubble { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 14px; word-wrap: break-word; }
        .message-bubble.sent { background: #0084ff; color: white; border-bottom-right-radius: 2px; }
        .message-bubble.received { background: var(--input-bg); border-bottom-left-radius: 2px; }
        .chat-footer { padding: 10px; background: var(--header-bg); display: flex; gap: 10px; border-top: 1px solid var(--border-color); }
        #messageInput { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 25px; color: var(--text-color); outline: none; }
    </style>
</head>
<body>

    <div id="loader-overlay" class="hidden">
        <div class="dots-loader">
            <div></div><div></div><div></div>
        </div>
    </div>

    <div id="auth-container">
        <div id="login-form" class="auth-card">
            <h1 class="app-logo">TCHAT</h1>
            <input type="text" id="loginEmailPhone" placeholder="Email or Phone">
            <input type="password" id="loginPass" placeholder="Password">
            <button type="button" onclick="login()">Login</button>
            <p class="toggle-txt" onclick="toggleAuth(true)">Create New Account</p>
        </div>
        <div id="reg-form" class="auth-card" style="display:none;">
            <h1 class="app-logo">✨ Register ✨</h1>
            <input type="text" id="regEmailPhone" placeholder="Email or Phone">
            <input type="password" id="regPass" placeholder="Password">
            <button type="button" onclick="register()">Register</button>
            <p class="toggle-txt" onclick="toggleAuth(false)">Back to Login</p>
        </div>
    </div>

    <div id="app-interface">
        <div class="header">
            <img id="myPic" class="post-avatar" src="" onclick="showMyProfile()">
            <h2 onclick="showNewsfeed()">Feed</h2>
            <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#8c442c; font-size: 18px;"></i>
        </div>

        <div id="newsfeed-page" class="page-content">
            <div class="create-post">
                <div class="post-input-row">
                    <img id="postMyPic" class="post-avatar" src="" onclick="showMyProfile()">
                    <input type="text" id="postText" placeholder="What's on your mind?">
                </div>
                
                <div id="mediaPreviewContainer" class="media-preview-area">
                    <button class="cancel-media-btn" onclick="clearSelectedMedia()"><i class="fas fa-times"></i></button>
                </div>

                <div class="post-options-row">
                    <label for="postMediaInput" class="media-upload-btn">
                        <i class="fas fa-images"></i> Photo / Video
                    </label>
                    <input type="file" id="postMediaInput" accept="image/*,video/*" style="display:none;" onchange="handlePostMediaSelect(event)">
                    <button class="post-btn" onclick="createPost()">Post</button>
                </div>
            </div>
            <div id="feed-container"></div>
            <div id="load-more-container" class="load-more-container hidden">
                <button class="load-more-btn" onclick="loadMorePosts()">Load More</button>
            </div>
        </div>

        <div id="profile-page" class="page-content hidden">
            <div class="header">
                <i class="fas fa-arrow-left" onclick="showNewsfeed()" style="cursor:pointer;"></i>
                <h2 style="margin-left: 15px; flex: 1;">Profile</h2>
            </div>
            <div class="profile-container">
                <div class="profile-pic-wrapper">
                    <img id="profPic" class="big-prof-pic" src="">
                    <label id="cam-label" for="fileInput" class="cam-icon">
                        <i class="fas fa-camera"></i>
                    </label>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="uploadPhoto(event)">
                </div>
                <div style="display: flex; align-items: center; justify-content: center; margin-top:15px;">
                    <h3 id="profName" style="font-size: 22px;">Name</h3>
                    <i id="edit-name-icon" class="fas fa-pen" style="margin-left: 10px; color:#8c442c; cursor:pointer;" onclick="changeName()"></i>
                </div>
                
                <div id="profile-actions-area">
                    <button id="msg-btn-prof">Message</button>
                    <button id="theme-toggle-btn" class="theme-btn" onclick="toggleTheme()">
                        <i class="fas fa-moon"></i> <span>Dark Mode</span>
                    </button>
                </div>
            </div>

            <div id="profile-visitors-dashboard" class="visitors-section hidden">
                <h4><i class="fas fa-eye"></i> Profile Visitors</h4>
                <div id="visitors-list-container" class="visitors-list"></div>
            </div>

            <div id="user-posts-container"></div>
        </div>

        <div id="chat-toggle-btn" onclick="openChatList()">
            <i class="fas fa-comment-dots"></i>
        </div>
    </div>

    <div id="users-page" class="hidden">
        <div class="header">
            <i class="fas fa-arrow-left" onclick="closeChatList()"></i>
            <h2 style="margin-left: 15px; flex: 1;">Messages</h2>
        </div>
        <div id="users-list"></div>
    </div>

    <div id="inbox-page" class="hidden">
        <div class="header">
            <i class="fas fa-arrow-left" onclick="closeInbox()"></i>
            <img id="pPic" class="post-avatar" style="margin-left:15px; cursor:pointer;" src="" onclick="visitFromInbox()">
            <div style="margin-left:12px; flex:1;">
                <h4 id="pName" style="font-size: 15px; cursor:pointer;" onclick="visitFromInbox()">Name</h4>
            </div>
        </div>
        <div id="chat-box"></div>
        <div class="chat-footer">
            <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" style="background:transparent; border:none; color:#0084ff; font-size:22px;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        const APP_VERSION = "2.0.3"; 
        const savedVersion = localStorage.getItem('app_version');
        if (savedVersion !== APP_VERSION) {
            localStorage.setItem('app_version', APP_VERSION);
            window.location.reload(true); 
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { initializeFirestore, getFirestore, doc, setDoc, getDoc, getDocs, collection, query, orderBy, limit, startAfter, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ========================================================
        // DATABASE CONFIGURATIONS
        // ========================================================
        const firebaseConfigAuth = {
            apiKey: "AIzaSyCOwXc5gc46tz1UjPEqcA993YS62clgV_k",
            authDomain: "tchat-46fdb.firebaseapp.com",
            projectId: "tchat-46fdb",
            storageBucket: "tchat-46fdb.firebasestorage.app",
            messagingSenderId: "223368702559",
            appId: "1:223368702559:web:65b9a708ffb81a861909ea"
        };

        const firebaseConfigApp = {
            apiKey: "AIzaSyDEomqqoxCRZD_27bO70G1MibcAZIV6dQU",
            authDomain: "tchat-b.firebaseapp.com",
            projectId: "tchat-b",
            storageBucket: "tchat-b.firebasestorage.app",
            messagingSenderId: "501622865543",
            appId: "1:501622865543:web:8c11cb04aed6c6fd1dc222"
        };

        const firebaseConfigChat = {
            apiKey: "AIzaSyAT22X04lwGjaneGGW9sKzeO6hWVAA3n6g",
            authDomain: "tchat-a9707.firebaseapp.com",
            databaseURL: "https://tchat-a9707-default-rtdb.firebaseio.com",
            projectId: "tchat-a9707",
            storageBucket: "tchat-a9707.firebasestorage.app",
            messagingSenderId: "324756549796",
            appId: "1:324756549796:web:f557ebab16be9e5545f631"
        };

        const appAuth = initializeApp(firebaseConfigAuth, "authInstance");
        const appApp = initializeApp(firebaseConfigApp, "appInstance");
        const appChat = initializeApp(firebaseConfigChat, "chatInstance");

        const dbAuth = getFirestore(appAuth); 
        const dbApp = getFirestore(appApp);   
        const dbChat = getDatabase(appChat);  

        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let currentChatId = null;
        let activeChatPartner = null; 
        let currentProfileListener = null; 
        let currentVisitorsListener = null; 
        let selectedPostMediaRaw = null; 
        let selectedPostMediaType = null; 

        // Pagination State
        let lastVisiblePost = null;
        let isFetchingPosts = false;
        const POSTS_LIMIT = 15;

        const defaultPic = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        let globalChatListeners = {};

        function toggleLoader(show) {
            const loader = document.getElementById('loader-overlay');
            if (loader) {
                if (show) loader.classList.remove('hidden');
                else loader.classList.add('hidden');
            }
        }

        // Global HTML Expose Function 
        function generatePostHTML(p) {
            const likeCount = (p.likes && typeof p.likes === 'object') ? Object.keys(p.likes).length : 0;
            const cmtCount = (p.comments && typeof p.comments === 'object') ? Object.keys(p.comments).length : 0;
            const isLiked = p.likes && p.likes[currentUser.id];
            let cmtHtml = "";
            if(p.comments) {
                Object.keys(p.comments).forEach(cid => {
                    const c = p.comments[cid];
                    cmtHtml += `<div class="comment-item"><span class="comment-user" onclick="visitProfile('${c.uid}')">${c.name}:</span> ${c.text}${c.uid === currentUser.id ? `<div class="cmt-actions"><i class="fas fa-trash" onclick="deleteComment('${p.id}', '${cid}')"></i></div>` : ''}</div>`;
                });
            }
            let mediaMarkup = p.media ? (p.mediaType === 'video' ? `<div class="post-media-container"><video src="${p.media}" controls preload="metadata"></video></div>` : `<div class="post-media-container"><img src="${p.media}"></div>`) : "";

            return `<div class="post-card" id="post-card-${p.id}"><div class="post-header"><img src="${p.pic || defaultPic}" class="post-avatar" onclick="visitProfile('${p.uid}')"><div><div class="post-user" onclick="visitProfile('${p.uid}')">${p.name}</div><div class="post-time">${new Date(p.timestamp).toLocaleString()}</div></div>${p.uid === currentUser.id ? `<i class="fas fa-trash-alt del-btn" onclick="deletePost('${p.id}')"></i>` : ''}</div><div class="post-content">${p.text || ""}</div>${mediaMarkup}<div class="post-stats"><span><i class="fas fa-thumbs-up"></i> <span id="like-count-${p.id}">${likeCount}</span></span><span><span id="cmt-count-${p.id}">${cmtCount}</span> Comments</span></div><div class="post-actions"><span id="like-btn-${p.id}" class="${isLiked?'liked':''}" onclick="toggleLike('${p.id}')"><i class="fas fa-thumbs-up"></i> Like</span><span onclick="showComments('${p.id}')"><i class="fas fa-comment"></i> Comment</span></div><div class="comment-section" id="comments-${p.id}"><div id="comment-list-${p.id}">${cmtHtml}</div><div class="comment-input-row"><input type="text" id="cmt-inp-${p.id}" placeholder="Write a comment..."><i class="fas fa-paper-plane" onclick="addComment('${p.id}')" style="color:#8c442c; margin-top:5px; cursor:pointer;"></i></div></div></div>`;
        }
        window.generatePostHTML = generatePostHTML;

        // Helper to Compress Base64 Image Strings (Under 150KB)
        function compressImage(base64Str, maxWidth = 600, maxHeight = 600) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                };
            });
        }

        // --- AUTH LOGIC ---
        window.toggleAuth = (showReg) => {
            if(showReg) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('reg-form').style.display = 'block';
            } else {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('reg-form').style.display = 'none';
            }
        }

        window.login = async () => {
            const ep = document.getElementById('loginEmailPhone').value.trim();
            const ps = document.getElementById('loginPass').value.trim();
            if(!ep || !ps) return;
            toggleLoader(true);
            try {
                const querySnapshot = await getDocs(collection(dbAuth, "users"));
                let found = null;
                querySnapshot.forEach((doc) => {
                    if(doc.data().emailPhone === ep && doc.data().password === ps) found = doc.data();
                });
                if(found) { localStorage.setItem('user', JSON.stringify(found)); location.reload(); }
                else { toggleLoader(false); alert("Invalid login!"); }
            } catch(e) { toggleLoader(false); alert("Error logging in: " + e.message); }
        }

        window.register = async () => {
            const ep = document.getElementById('regEmailPhone').value.trim();
            const ps = document.getElementById('regPass').value.trim();
            if(!ep || !ps) { alert("Please enter both Email/Phone and Password!"); return; }
            toggleLoader(true);
            try {
                const querySnapshot = await getDocs(collection(dbAuth, "users"));
                let alreadyExists = false;
                querySnapshot.forEach((doc) => {
                    if(doc.data().emailPhone === ep) alreadyExists = true;
                });
                if(alreadyExists) { toggleLoader(false); alert("This Email or Phone is already registered!"); return; }
                
                const id = 'user_' + Date.now();
                const user = { id, emailPhone: ep, username: ep.split('@')[0], password: ps, profilePic: defaultPic };
                await setDoc(doc(dbAuth, "users", id), user);
                localStorage.setItem('user', JSON.stringify(user));
                toggleLoader(false);
                location.reload();
            } catch(e) { toggleLoader(false); alert("Error registering: " + e.message); }
        }

        window.logout = () => { localStorage.clear(); location.reload(); }

        // --- MEDIA HANDLING ---
        window.handlePostMediaSelect = (event) => {
            const file = event.target.files[0]; if (!file) return;
            if (file.size > 0.5 * 1024 * 1024) { alert("File size too large! Select under 500KB."); event.target.value = ""; return; }
            selectedPostMediaType = file.type.startsWith('video/') ? 'video' : 'image';
            const reader = new FileReader();
            reader.onload = async (e) => {
                let rawData = e.target.result;
                if(selectedPostMediaType === 'image') {
                    rawData = await compressImage(rawData);
                }
                selectedPostMediaRaw = rawData;
                const container = document.getElementById('mediaPreviewContainer');
                const oldMedia = container.querySelector('img, video'); if (oldMedia) oldMedia.remove();
                const mediaEl = document.createElement(selectedPostMediaType === 'image' ? 'img' : 'video');
                mediaEl.src = selectedPostMediaRaw; if(selectedPostMediaType === 'video') mediaEl.controls = true;
                container.appendChild(mediaEl); container.style.display = 'block';
            };
            reader.readAsDataURL(file);
        };

        window.clearSelectedMedia = () => {
            selectedPostMediaRaw = null; selectedPostMediaType = null;
            document.getElementById('postMediaInput').value = "";
            const container = document.getElementById('mediaPreviewContainer'); container.style.display = 'none';
            const oldMedia = container.querySelector('img, video'); if (oldMedia) oldMedia.remove();
        };

        // --- PROFILE & VISITORS ---
        window.visitProfile = async (uid) => {
            toggleLoader(true);
            if(currentProfileListener) { currentProfileListener(); currentProfileListener = null; } 
            if(currentVisitorsListener) { currentVisitorsListener(); currentVisitorsListener = null; }

            const snap = await getDoc(doc(dbAuth, "users", uid));
            if(!snap.exists()) { toggleLoader(false); return; }
            const userData = snap.data();
            
            document.getElementById('newsfeed-page').classList.add('hidden');
            document.getElementById('load-more-container').classList.add('hidden');
            document.getElementById('users-page').classList.add('hidden');
            document.getElementById('inbox-page').classList.add('hidden');
            document.getElementById('profile-page').classList.remove('hidden');
            
            document.getElementById('profPic').src = userData.profilePic || defaultPic;
            document.getElementById('profName').innerText = userData.username;
            
            const isMe = uid === currentUser.id;
            document.getElementById('cam-label').style.display = isMe ? 'flex' : 'none';
            document.getElementById('edit-name-icon').style.display = isMe ? 'block' : 'none';

            const msgBtn = document.getElementById('msg-btn-prof');
            const themeBtn = document.getElementById('theme-toggle-btn');
            const visitorsDashboard = document.getElementById('profile-visitors-dashboard');
            
            if(!isMe) {
                msgBtn.style.display = 'block'; msgBtn.onclick = () => openInbox(userData);
                themeBtn.style.display = 'none'; visitorsDashboard.classList.add('hidden');
                
                await setDoc(doc(dbApp, `profile_visitors/${uid}/recent`, currentUser.id), {
                    uid: currentUser.id, name: currentUser.username, pic: currentUser.profilePic || defaultPic, timestamp: Date.now()
                });
            } else {
                msgBtn.style.display = 'none'; themeBtn.style.display = 'inline-flex';
                updateThemeButton(localStorage.getItem('theme') || 'dark');
                visitorsDashboard.classList.remove('hidden');
                
                const visitorsQuery = query(collection(dbApp, `profile_visitors/${currentUser.id}/recent`), orderBy("timestamp", "desc"));
                currentVisitorsListener = onSnapshot(visitorsQuery, (vSnap) => {
                    const listContainer = document.getElementById('visitors-list-container'); listContainer.innerHTML = "";
                    let count = 0;
                    vSnap.forEach(child => {
                        const v = child.data(); count++;
                        listContainer.innerHTML += `
                            <div class="visitor-item">
                                <img src="${v.pic || defaultPic}" class="visitor-img">
                                <div class="visitor-info">
                                    <span class="visitor-name" onclick="visitProfile('${v.uid}')">${v.name}</span>
                                    <div class="visitor-time">Visited: ${new Date(v.timestamp).toLocaleString()}</div>
                                </div>
                            </div>`;
                    });
                    if (count === 0) listContainer.innerHTML = `<p style="font-size:12px; opacity:0.5; padding:10px;">No recent visitors yet.</p>`;
                });
            }

            const userPostsQuery = query(collection(dbApp, "posts"), orderBy("timestamp", "desc"));
            currentProfileListener = onSnapshot(userPostsQuery, (snap) => {
                const userFeed = document.getElementById('user-posts-container'); userFeed.innerHTML = "";
                snap.forEach(c => { 
                    const p = c.data(); p.id = c.id;
                    if(p.uid === uid) userFeed.innerHTML += generatePostHTML(p);
                });
                toggleLoader(false);
            });
        }

        window.showMyProfile = () => visitProfile(currentUser.id);
        window.showNewsfeed = () => {
            if(currentProfileListener) { currentProfileListener(); currentProfileListener = null; }
            if(currentVisitorsListener) { currentVisitorsListener(); currentVisitorsListener = null; }
            document.getElementById('profile-page').classList.add('hidden');
            document.getElementById('newsfeed-page').classList.remove('hidden');
            if(lastVisiblePost) {
                document.getElementById('load-more-container').classList.remove('hidden');
            }
        }
        window.visitFromInbox = () => { if(activeChatPartner) visitProfile(activeChatPartner.id); }

        // --- OPTIMIZED POST ACTIONS & REALTIME RE-RENDER FIX ---
        window.createPost = async () => {
            const txt = document.getElementById('postText').value.trim();
            if(!txt && !selectedPostMediaRaw) return;
            toggleLoader(true);
            const pId = 'post_' + Date.now();
            const postObj = { id: pId, uid: currentUser.id, name: currentUser.username, pic: currentUser.profilePic || defaultPic, text: txt, timestamp: Date.now(), likes: {}, comments: {} };
            if (selectedPostMediaRaw) { postObj.media = selectedPostMediaRaw; postObj.mediaType = selectedPostMediaType; }
            
            await setDoc(doc(dbApp, "posts", pId), postObj);
            document.getElementById('postText').value = ""; clearSelectedMedia(); toggleLoader(false);
        }

        window.toggleLike = async (pid) => {
            const postRef = doc(dbApp, "posts", pid); const snap = await getDoc(postRef);
            if(snap.exists()) {
                let likes = snap.data().likes || {};
                if(likes[currentUser.id]) delete likes[currentUser.id]; else likes[currentUser.id] = true;
                await updateDoc(postRef, { likes: likes });
            }
        }

        window.addComment = async (pid) => {
            const inp = document.getElementById(`cmt-inp-${pid}`); const txt = inp.value.trim(); if(!txt) return;
            const postRef = doc(dbApp, "posts", pid); const snap = await getDoc(postRef);
            if(snap.exists()) {
                let comments = snap.data().comments || {}; const cId = 'cmt_' + Date.now();
                comments[cId] = { cid: cId, uid: currentUser.id, name: currentUser.username, text: txt, timestamp: Date.now() };
                await updateDoc(postRef, { comments: comments }); inp.value = "";
            }
        }

        window.showComments = (pid) => { const el = document.getElementById(`comments-${pid}`); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
        window.deletePost = async (pid) => { 
            if(confirm("Delete this post?")) {
                await deleteDoc(doc(dbApp, "posts", pid)); 
                const el = document.getElementById(`post-card-${pid}`);
                if(el) el.remove();
            }
        }
        window.deleteComment = async (pid, cid) => {
            if(confirm("Delete comment?")) {
                const postRef = doc(dbApp, "posts", pid); const snap = await getDoc(postRef);
                if(snap.exists()){
                    let comments = snap.data().comments || {}; delete comments[cid];
                    await updateDoc(postRef, { comments: comments });
                }
            }
        }

        // --- PAGINATION / OPTIMIZED LOAD MORE ---
        async function fetchInitialPosts() {
            toggleLoader(true);
            isFetchingPosts = true;
            const feedContainer = document.getElementById('feed-container');
            feedContainer.innerHTML = "";

            const qRef = query(collection(dbApp, "posts"), orderBy("timestamp", "desc"), limit(POSTS_LIMIT));
            
            // Listen for changes ONLY on currently visible block or new posts
            onSnapshot(qRef, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    const p = change.doc.data();
                    p.id = change.doc.id;
                    
                    const existingCard = document.getElementById(`post-card-${p.id}`);
                    if (change.type === "added" && !existingCard) {
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = generatePostHTML(p);
                        feedContainer.insertBefore(wrapper.firstChild, feedContainer.firstChild);
                    } else if (change.type === "modified" && existingCard) {
                        // Dynamically update stats without wiping dom
                        const likeCount = p.likes ? Object.keys(p.likes).length : 0;
                        const cmtCount = p.comments ? Object.keys(p.comments).length : 0;
                        const isLiked = p.likes && p.likes[currentUser.id];
                        
                        document.getElementById(`like-count-${p.id}`).innerText = likeCount;
                        document.getElementById(`cmt-count-${p.id}`).innerText = cmtCount;
                        
                        const btn = document.getElementById(`like-btn-${p.id}`);
                        if(isLiked) btn.classList.add('liked'); else btn.classList.remove('liked');
                        
                        // Update Comments list safely
                        let cmtHtml = "";
                        if(p.comments) {
                            Object.keys(p.comments).forEach(cid => {
                                const c = p.comments[cid];
                                cmtHtml += `<div class="comment-item"><span class="comment-user" onclick="visitProfile('${c.uid}')">${c.name}:</span> ${c.text}${c.uid === currentUser.id ? `<div class="cmt-actions"><i class="fas fa-trash" onclick="deleteComment('${p.id}', '${cid}')"></i></div>` : ''}</div>`;
                            });
                        }
                        document.getElementById(`comment-list-${p.id}`).innerHTML = cmtHtml;
                    } else if (change.type === "removed" && existingCard) {
                        existingCard.remove();
                    }
                });

                if (snapshot.docs.length > 0 && !lastVisiblePost) {
                    lastVisiblePost = snapshot.docs[snapshot.docs.length - 1];
                    document.getElementById('load-more-container').classList.remove('hidden');
                }
                toggleLoader(false);
                isFetchingPosts = false;
            });
        }

        window.loadMorePosts = async () => {
            if (!lastVisiblePost || isFetchingPosts) return;
            toggleLoader(true);
            isFetchingPosts = true;

            const nextQuery = query(
                collection(dbApp, "posts"),
                orderBy("timestamp", "desc"),
                startAfter(lastVisiblePost),
                limit(POSTS_LIMIT)
            );

            const snapshot = await getDocs(nextQuery);
            const feedContainer = document.getElementById('feed-container');

            if (snapshot.docs.length > 0) {
                snapshot.docs.forEach(docSnap => {
                    const p = docSnap.data();
                    p.id = docSnap.id;
                    if(!document.getElementById(`post-card-${p.id}`)) {
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = generatePostHTML(p);
                        feedContainer.appendChild(wrapper.firstChild);
                    }
                });
                lastVisiblePost = snapshot.docs[snapshot.docs.length - 1];
                if(snapshot.docs.length < POSTS_LIMIT) {
                    document.getElementById('load-more-container').classList.add('hidden');
                }
            } else {
                document.getElementById('load-more-container').classList.add('hidden');
            }
            toggleLoader(false);
            isFetchingPosts = false;
        };

        // --- CHAT LOGIC ---
        window.openChatList = () => { document.getElementById('users-page').classList.remove('hidden'); }
        window.closeChatList = () => document.getElementById('users-page').classList.add('hidden');
        window.closeInbox = () => { document.getElementById('inbox-page').classList.add('hidden'); activeChatPartner = null; }

        window.openInbox = (user) => {
            toggleLoader(true); activeChatPartner = user;
            document.getElementById('users-page').classList.remove('hidden');
            document.getElementById('profile-page').classList.add('hidden');
            document.getElementById('inbox-page').classList.remove('hidden');
            document.getElementById('pName').innerText = user.username;
            document.getElementById('pPic').src = user.profilePic || defaultPic;
            
            const ids = [currentUser.id, user.id].sort(); currentChatId = ids[0] + '_' + ids[1];
            onValue(ref(dbChat, 'chats/'+currentChatId), (snap) => {
                const box = document.getElementById('chat-box'); box.innerHTML = "";
                snap.forEach(c => {
                    const m = c.val(); const isSent = m.sender === currentUser.id;
                    box.innerHTML += `<div class="message-wrapper ${isSent?'sent':'received'}"><div class="message-bubble ${isSent?'sent':'received'}">${m.text}</div></div>`;
                });
                box.scrollTop = box.scrollHeight; toggleLoader(false);
            });
        }

        window.sendMessage = async () => {
            const input = document.getElementById('messageInput'); if(!input.value.trim()) return;
            await push(ref(dbChat, 'chats/'+currentChatId), { sender: currentUser.id, text: input.value, timestamp: Date.now() });
            input.value = "";
        }

        // --- PROFILE PICTURE & NAME EDITS ---
        window.uploadPhoto = (event) => {
            const file = event.target.files[0]; if (!file) return;
            if (file.size > 0.5 * 1024 * 1024) { alert("File size too large! Select under 500KB."); return; }
            toggleLoader(true);
            const reader = new FileReader();
            reader.onload = async (e) => {
                const img = await compressImage(e.target.result, 300, 300);
                await updateDoc(doc(dbAuth, "users", currentUser.id), { profilePic: img });
                currentUser.profilePic = img; localStorage.setItem('user', JSON.stringify(currentUser)); location.reload();
            };
            reader.readAsDataURL(file);
        };

        window.changeName = async () => {
            const newName = prompt("Enter new name:", currentUser.username);
            if (newName && newName.trim() !== "") {
                toggleLoader(true);
                await updateDoc(doc(dbAuth, "users", currentUser.id), { username: newName.trim() });
                currentUser.username = newName.trim(); localStorage.setItem('user', JSON.stringify(currentUser)); location.reload();
            }
        };

        // --- THEME ---
        window.toggleTheme = () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const targetTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', targetTheme);
            localStorage.setItem('theme', targetTheme);
            updateThemeButton(targetTheme);
        };

        function updateThemeButton(theme) {
            const btn = document.getElementById('theme-toggle-btn');
            if(!btn) return;
            btn.innerHTML = theme === 'light' ? `<i class="fas fa-sun"></i> <span>Light Mode</span>` : `<i class="fas fa-moon"></i> <span>Dark Mode</span>`;
        }
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // App Initialization
        if(currentUser) {
            toggleLoader(true);
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-interface').style.display = 'flex';
            document.getElementById('myPic').src = currentUser.profilePic || defaultPic;
            document.getElementById('postMyPic').src = currentUser.profilePic || defaultPic;
            
            // Optimized initial pagination fetch
            fetchInitialPosts();

            onSnapshot(collection(dbAuth, "users"), (snap) => {
                const list = document.getElementById('users-list'); list.innerHTML = "";
                snap.forEach(c => {
                    const u = c.data();
                    if(u.id !== currentUser.id) {
                        const div = document.createElement('div'); div.className = 'chat-item';
                        div.innerHTML = `<img src="${u.profilePic || defaultPic}"><div><h4>${u.username}</h4><small>Tap to chat</small></div>`;
                        div.onclick = () => openInbox(u); list.appendChild(div);

                        const ids = [currentUser.id, u.id].sort(); const chatRoomId = ids[0] + '_' + ids[1];
                        if (!globalChatListeners[chatRoomId]) {
                            let lastMsgTime = Date.now();
                            globalChatListeners[chatRoomId] = onValue(ref(dbChat, 'chats/' + chatRoomId), (chatSnap) => {
                                chatSnap.forEach(msgNode => {
                                    const m = msgNode.val();
                                    if(m.timestamp > lastMsgTime) { lastMsgTime = m.timestamp; }
                                });
                            });
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
